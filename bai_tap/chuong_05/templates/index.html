<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1: Máy tính cơ bản</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 700;
        }
        .calculator-form {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        /* Ô chọn phép toán thu nhỏ lại vừa vặn */
        .form-group.op-group {
            flex: 0 0 70px;
        }
        input[type="text"], select {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
            text-align: center;
            color: #334155;
        }
        input[type="text"]:focus, select:focus {
            border-color: #6366f1;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        select {
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
        }
        .btn-calc {
            height: 48px;
            width: 52px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            background-color: #6366f1;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-calc:hover {
            background-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-calc:active { transform: scale(0.95); }
        .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 6px;
            font-weight: 600;
            text-align: center;
        }
        .result-box {
            margin-top: 25px;
            padding: 14px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            text-align: center;
            color: #166534;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🧮 Máy Tính Cơ Bản</h2>

        <form method="post" class="calculator-form">
            <!-- Số A -->
            <div class="form-group">
                <input type="text" name="a" value="{{ values.a }}" placeholder="Số A" autocomplete="off">
                {% if errors.a %}
                    <span class="error">{{ errors.a }}</span>
                {% endif %}
            </div>

            <!-- Phép tính (đã thu nhỏ) -->
            <div class="form-group op-group">
                <select name="op">
                    {% for item in ops %}
                        <option value="{{ item }}" {% if values.op == item %}selected{% endif %}>
                            {{ item }}
                        </option>
                    {% endfor %}
                </select>
                {% if errors.op %}
                    <span class="error">{{ errors.op }}</span>
                {% endif %}
            </div>

            <!-- Số B -->
            <div class="form-group">
                <input type="text" name="b" value="{{ values.b }}" placeholder="Số B" autocomplete="off">
                {% if errors.b %}
                    <span class="error">{{ errors.b }}</span>
                {% endif %}
            </div>

            <button type="submit" class="btn-calc">=</button>
        </form>

        {% if result %}
            <div class="result-box">
                Kết quả: {{ result }}
            </div>
        {% endif %}
    </div>

</body>
</html>
